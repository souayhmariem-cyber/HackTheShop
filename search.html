<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HackTheShop - Search</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

  <!-- PARTICLES -->
  <canvas id="particles"></canvas>

  <div class="wrapper">

    <!-- SIDEBAR -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <button class="close-sidebar" onclick="toggleSidebar()">✕</button>
      </div>
      <nav class="sidebar-nav">
        <a href="login.html"><i class="fa fa-user"></i> Login</a>
        <a href="promotions.html"><i class="fa fa-tag"></i> Promotions</a>
        <a href="account.html"><i class="fa fa-circle-user"></i> Your Account</a>
        <a href="customer-service.html"><i class="fa fa-headset"></i> Customer Service</a>
      </nav>
    </aside>

    <div class="overlay" id="overlay" onclick="toggleSidebar()"></div>

    <!-- NAVBAR -->
    <nav class="navbar">
      <div class="nav-left">
        <button class="burger" onclick="toggleSidebar()">
          <i class="fa fa-bars"></i>
        </button>
        <a href="login.html" class="nav-login">Login</a>
      </div>
      <div class="nav-center">
        <a href="index.html" style="text-decoration:none;">
          <span class="logo">HackTheShop</span>
        </a>
      </div>
      <div class="nav-right">
        <button class="nav-icon"><i class="fa fa-search"></i></button>
        <button class="nav-icon"><i class="fa fa-heart"></i></button>
        <button class="nav-icon"><i class="fa fa-shopping-cart"></i></button>
      </div>
    </nav>

    <!-- SEARCH SECTION -->
    <section class="search-section">
      <h2>Search Products</h2>
      <p class="search-subtitle">Find what you're looking for</p>

      <div class="search-bar">
        <input type="text" id="searchInput" placeholder="Ex: laptop, airpods...">
        <button onclick="doSearch()">
          <i class="fa fa-search"></i> Search
        </button>
      </div>

      <div class="search-result" id="searchResult"></div>
    </section>

    <!-- FOOTER -->
    <footer class="footer">
      © 2025 HackTheShop — Educational Cybersecurity Project
    </footer>

  </div>

  <script src="js/main.js"></script>
  <script src="js/demo.js"></script>
</body>
</html>
