<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HackTheShop - Products</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

  <!-- PARTICLES -->
  <canvas id="particles"></canvas>

  <div class="wrapper">

    <!-- SIDEBAR -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <button class="close-sidebar" onclick="toggleSidebar()">✕</button>
      </div>
      <nav class="sidebar-nav">
        <a href="login.html"><i class="fa fa-user"></i> Login</a>
        <a href="promotions.html"><i class="fa fa-tag"></i> Promotions</a>
        <a href="account.html"><i class="fa fa-circle-user"></i> Your Account</a>
        <a href="customer-service.html"><i class="fa fa-headset"></i> Customer Service</a>
      </nav>
    </aside>

    <div class="overlay" id="overlay" onclick="toggleSidebar()"></div>

    <!-- NAVBAR -->
    <nav class="navbar">
      <div class="nav-left">
        <button class="burger" onclick="toggleSidebar()">
          <i class="fa fa-bars"></i>
        </button>
        <a href="login.html" class="nav-login">Login</a>
      </div>
      <div class="nav-center">
        <a href="index.html" style="text-decoration:none;">
          <span class="logo">HackTheShop</span>
        </a>
      </div>
      <div class="nav-right">
        <button class="nav-icon"><i class="fa fa-search"></i></button>
        <button class="nav-icon"><i class="fa fa-heart"></i></button>
        <button class="nav-icon"><i class="fa fa-shopping-cart"></i></button>
      </div>
    </nav>

    <!-- COMMENTS SECTION -->
    <section class="comments-section">
      <h2 class="section-title">Customer Reviews</h2>

      <div class="comments-list" id="commentsList">
        <div class="comment-card">
          <div class="comment-author">Ahmed B.</div>
          <div class="comment-text">Great product, highly recommend!</div>
        </div>
        <div class="comment-card">
          <div class="comment-author">Sara M.</div>
          <div class="comment-text">Fast delivery, excellent quality.</div>
        </div>
      </div>

      <div class="comment-form">
        <h3>Leave a Review</h3>
        <div class="form-group">
          <label>Your Name</label>
          <input type="text" id="commentAuthor" placeholder="Your name">
        </div>
        <div class="form-group">
          <label>Your Review</label>
          <textarea id="commentText" rows="4" placeholder="Write your review..."></textarea>
        </div>
        <button class="login-btn" onclick="addComment()">Post Review</button>
      </div>


    </section>

    <!-- FOOTER -->
    <footer class="footer">
      © 2025 HackTheShop — Educational Cybersecurity Project
    </footer>

  </div>

  <script src="js/main.js"></script>
  <script src="js/demo.js"></script>
</body>
</html>
